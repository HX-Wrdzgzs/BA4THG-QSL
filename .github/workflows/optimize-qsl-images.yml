name: Optimize QSL images

on:
  push:
    branches:
      - main
    paths:
      - "图片/**/*.png"
      - "app.js"
      - "index.html"
      - "scripts/optimize_images.py"
      - ".github/workflows/optimize-qsl-images.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optimize-qsl-images-main
  cancel-in-progress: true

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate WebP thumbnails and full-size images
        run: python scripts/optimize_images.py

      - name: Verify page image references
        run: |
          if grep -RInE '\.png([?"'"'"'[:space:]#]|$)' index.html app.js; then
            echo "PNG page reference detected."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          paths = list((Path("图片") / "thumbs").glob("*.webp"))
          paths += list((Path("图片") / "webp").glob("*.webp"))
          if not paths:
              raise SystemExit("No WebP assets were generated")
          for path in paths:
              with Image.open(path) as image:
                  if image.format != "WEBP":
                      raise SystemExit(f"Not a valid WebP: {path}")
          print(f"Validated {len(paths)} WebP assets")
          PY

      - name: Commit optimized assets to main
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app.js index.html "图片/thumbs" "图片/webp"
          git commit -m "Convert QSL display images to WebP [skip ci]"
          git push origin HEAD:main
