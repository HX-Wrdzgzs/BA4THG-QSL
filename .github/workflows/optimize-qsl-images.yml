name: Optimize QSL images

on:
  push:
    branches:
      - main
    paths:
      - "图片/**/*.png"
      - "app.js"
      - "index.html"
      - "scripts/optimize_images.py"
      - ".github/workflows/optimize-qsl-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Generate optimized assets
        run: python scripts/optimize_images.py

      - name: Commit optimized assets to main
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- app.js index.html README.md _headers "图片/thumbs"
          git commit -m "Optimize QSL image delivery [skip ci]"
          git push origin HEAD:main
