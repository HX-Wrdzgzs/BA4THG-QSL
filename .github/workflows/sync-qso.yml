name: Sync QSO archive

on:
  workflow_dispatch:
  schedule:
    - cron: "20 19 * * *"

permissions:
  contents: read

concurrency:
  group: qso-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate secrets
        env:
          QSO_SYNC_URL: ${{ secrets.QSO_SYNC_URL }}
          QSO_ADMIN_TOKEN: ${{ secrets.QSO_ADMIN_TOKEN }}
        run: |
          test -n "$QSO_SYNC_URL" || { echo "Missing QSO_SYNC_URL"; exit 1; }
          test -n "$QSO_ADMIN_TOKEN" || { echo "Missing QSO_ADMIN_TOKEN"; exit 1; }

      - name: Sync public QSO records into D1
        env:
          QSO_SYNC_URL: ${{ secrets.QSO_SYNC_URL }}
          QSO_ADMIN_TOKEN: ${{ secrets.QSO_ADMIN_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer $QSO_ADMIN_TOKEN" \
            --header "Accept: application/json" \
            "$QSO_SYNC_URL/api/sync/mzyyun"
